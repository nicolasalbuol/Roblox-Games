# Minimal selene std: Luau builtins + the Roblox globals this project uses.
# (The full Roblox std needs a network fetch blocked in the build sandbox.)
base: luau
globals:
  game: {any: true}
  workspace: {any: true}
  script: {any: true}
  plugin: {any: true}
  Instance: {any: true}
  Vector3: {any: true}
  Vector2: {any: true}
  CFrame: {any: true}
  Color3: {any: true}
  ColorSequence: {any: true}
  ColorSequenceKeypoint: {any: true}
  NumberSequence: {any: true}
  NumberSequenceKeypoint: {any: true}
  NumberRange: {any: true}
  UDim: {any: true}
  UDim2: {any: true}
  Rect: {any: true}
  Random: {any: true}
  TweenInfo: {any: true}
  Enum: {any: true}
  Font: {any: true}
  RaycastParams: {any: true}
  task: {any: true}
  debug: {any: true}
  warn: {any: true}
  tick: {any: true}
  typeof: {any: true}
  DateTime: {any: true}
  utf8: {any: true}
